name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: فك ملف المشروع
        run: |
          if [ ! -f unimate_app_bundle.txt ]; then echo "لا يوجد ملف المشروع بعد"; exit 0; fi
          python3 - <<'PYEOF'
          import re, os
          text = open('unimate_app_bundle.txt', encoding='utf-8').read()
          parts = re.split(r'^===FILE: (.+?) ===\n', text, flags=re.M)
          for i in range(1, len(parts), 2):
              path, body = parts[i], parts[i + 1]
              os.makedirs(os.path.dirname(path) or '.', exist_ok=True)
              with open(path, 'w', encoding='utf-8') as f:
                  f.write(body)
              print('wrote', path)
          PYEOF

      - uses: subosito/flutter-action@v2
        if: hashFiles('pubspec.yaml') != ''
        with:
          flutter-version: '3.24.5'
          channel: stable

      - name: إنشاء مجلد أندرويد
        if: hashFiles('pubspec.yaml') != ''
        run: |
          flutter create --platforms android --project-name unimate --org com.unimate "$RUNNER_TEMP/scaffold"
          cp -r "$RUNNER_TEMP/scaffold/android" .

      - name: تثبيت برنامج الصور
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      - name: تطبيق أيقونة التطبيق
        if: hashFiles('app_icon.png') != '' && hashFiles('android/app/src/main/AndroidManifest.xml') != ''
        run: |
          R=android/app/src/main/res
          for pair in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            d=${pair%%:*}
            s=${pair##*:}
            convert app_icon.png -resize ${s}x${s} "$R/mipmap-$d/ic_launcher.png"
          done

      - name: إعدادات الأمان والاسم
        if: hashFiles('android/app/src/main/AndroidManifest.xml') != ''
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's/<application/<application android:allowBackup="false"/' "$M"
          sed -i 's/android:label="[^"]*"/android:label="رفيق الطالب الجامعي"/' "$M"

      - name: إعداد التنبيهات والصلاحيات
        if: hashFiles('android/app/src/main/AndroidManifest.xml') != ''
        run: |
          python3 - <<'PYEOF'
          import os, re
          M = 'android/app/src/main/AndroidManifest.xml'
          s = open(M, encoding='utf-8').read()
          perms = ''.join('    <uses-permission android:name="android.permission.%s"/>\n' % p for p in ['POST_NOTIFICATIONS', 'SCHEDULE_EXACT_ALARM', 'RECEIVE_BOOT_COMPLETED', 'VIBRATE'])
          recv = (
              '<receiver android:exported="false" android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationReceiver" />\n'
              '<receiver android:exported="false" android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationBootReceiver">\n'
              '<intent-filter>\n'
              '<action android:name="android.intent.action.BOOT_COMPLETED"/>\n'
              '<action android:name="android.intent.action.MY_PACKAGE_REPLACED"/>\n'
              '<action android:name="android.intent.action.QUICKBOOT_POWERON"/>\n'
              '</intent-filter>\n'
              '</receiver>\n'
          )
          s = s.replace('<application', perms + '    <application', 1)
          s = s.replace('</application>', recv + '</application>', 1)
          open(M, 'w', encoding='utf-8').write(s)
          G = 'android/app/build.gradle'
          if os.path.exists(G):
              g = open(G, encoding='utf-8').read()
              if 'coreLibraryDesugaringEnabled' not in g:
                  g = re.sub(r'(compileOptions\s*\{)', r'\1\n        coreLibraryDesugaringEnabled true', g, count=1)
                  g += '\ndependencies {\n    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.0.4"\n}\n'
                  open(G, 'w', encoding='utf-8').write(g)
          PYEOF

      - name: نسخ صوت التنبيه
        if: hashFiles('sounds/alarm.mp3') != '' && hashFiles('android/app/src/main/AndroidManifest.xml') != ''
        run: |
          mkdir -p android/app/src/main/res/raw
          cp sounds/alarm.mp3 android/app/src/main/res/raw/alarm.mp3

      - name: تحميل المكتبات
        if: hashFiles('pubspec.yaml') != ''
        run: flutter pub get

      - name: بناء ملف APK
        if: hashFiles('pubspec.yaml') != ''
        run: flutter build apk --release --obfuscate --split-debug-info=build/symbols

      - name: رفع ملف APK للتحميل
        if: hashFiles('build/app/outputs/flutter-apk/app-release.apk') != ''
        uses: actions/upload-artifact@v4
        with:
          name: unimate-apk
          path: build/app/outputs/flutter-apk/app-release.apk
